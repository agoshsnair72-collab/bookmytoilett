<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BookMyToilet — Community</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#202124}nav{height:70px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#fff;position:sticky;top:0}.brand{font-size:21px;font-weight:800}.brand span{color:#16a085}.links{display:flex;gap:7px}.links a{padding:9px 13px;text-decoration:none;color:#5f6368;border-radius:9px;font-size:14px}.links a:hover{background:#f1f3f4}main{width:min(850px,92%);margin:auto;padding:40px 0}.title{text-align:center;margin-bottom:24px}.title h1{font-size:36px;margin:0 0 7px}.title p{color:#70757a}.chat{border:1px solid #e1e4e8;border-radius:16px;overflow:hidden;box-shadow:0 5px 25px rgba(0,0,0,.05)}#messages{height:500px;overflow-y:auto;padding:20px;background:#fafbfc}.msg{margin-bottom:15px}.name{font-size:12px;font-weight:800;color:#16a085;margin-bottom:4px}.bubble{display:inline-block;max-width:80%;padding:11px 14px;background:#fff;border:1px solid #e1e4e8;border-radius:12px;line-height:1.45;font-size:14px}.mine{text-align:right}.mine .name{color:#5f6368}.mine .bubble{background:#e6f4ea;border-color:#cce8d5}.send{display:flex;gap:9px;padding:13px;border-top:1px solid #e1e4e8;background:#fff}.send input{flex:1;border:1px solid #dadce0;border-radius:10px;padding:13px;font-size:14px;outline:none}.send button{border:0;background:#16a085;color:#fff;border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}.links a:last-child{font-weight:700}@media(max-width:650px){.links a{display:none}#messages{height:430px}}
</style></head><body>
<nav><div class="brand">BookMy<span>Toilet</span></div><div class="links"><a href="home.html">Home</a><a href="booking.html">Booking</a><a href="behaviour.html">Behaviour</a><a href="ranking.html">Ranking</a><a href="community.html">Community</a></div></nav>
<main><div class="title"><h1>Community</h1><p>A public space for everyone on BookMyToilet.</p></div>
<div class="chat"><div id="messages"></div><form class="send" id="sendForm"><input id="messageInput" maxlength="500" placeholder="Write a message..." autocomplete="off"><button>Send</button></form></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBO7VfF6_g0xqlk5hN6U3gVScepf1rxdMQ",
    authDomain: "bookmytoilet-d9db9.firebaseapp.com",
    projectId: "bookmytoilet-d9db9",
    storageBucket: "bookmytoilet-d9db9.firebasestorage.app",
    messagingSenderId: "312633534307",
    appId: "1:312633534307:web:d27390e8af8a4473001556"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const messagesRef = collection(db, "community");
const messagesQuery = query(messagesRef, orderBy("createdAt", "asc"));

onAuthStateChanged(auth, user => {
    if (!user) {
        location.href = "login.html";
        return;
    }

    startChat(user);
});

function startChat(user) {
    const box = document.getElementById("messages");
    const form = document.getElementById("sendForm");
    const input = document.getElementById("messageInput");

    // Everyone reads from the same "community" collection.
    onSnapshot(messagesQuery, snapshot => {
        box.innerHTML = "";

        snapshot.forEach(docSnap => {
            const message = docSnap.data();

            const messageElement = document.createElement("div");
            messageElement.className =
                "msg " + (message.userId === user.uid ? "mine" : "");

            const nameElement = document.createElement("div");
            nameElement.className = "name";
            nameElement.textContent = message.name || "User";

            const bubbleElement = document.createElement("div");
            bubbleElement.className = "bubble";
            bubbleElement.textContent = message.text || "";

            messageElement.appendChild(nameElement);
            messageElement.appendChild(bubbleElement);
            box.appendChild(messageElement);
        });

        box.scrollTop = box.scrollHeight;
    }, error => {
        console.error("Community chat error:", error);
        box.innerHTML =
            '<div style="color:#d93025;text-align:center;padding:20px;">' +
            'Unable to load the community chat.' +
            '</div>';
    });

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const text = input.value.trim();
        if (!text) return;

        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";

        // Clear immediately so the user cannot accidentally send twice.
        input.value = "";
        input.focus();

        try {
            await addDoc(messagesRef, {
                userId: user.uid,
                name: name,
                text: text,
                createdAt: serverTimestamp()
            });
        } catch (error) {
            console.error("Message send error:", error);
            input.value = text;
            alert("Message could not be sent. Please try again.");
        }
    });
}
</script></body></html>
