<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BookMyToilet — Behaviour</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#202124}nav{height:70px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#fff;position:sticky;top:0;z-index:4}.brand{font-size:21px;font-weight:800}.brand span{color:#16a085}.links{display:flex;gap:7px}.links a{padding:9px 13px;text-decoration:none;color:#5f6368;border-radius:9px;font-size:14px}.links a:hover{background:#f1f3f4}main{width:min(1050px,90%);margin:auto;padding:48px 0}.title{text-align:center}.title h1{font-size:38px;margin:0 0 8px}.title p{color:#70757a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.card{border:1px solid #e1e4e8;border-radius:15px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.label{font-size:12px;color:#80868b}.value{font-size:28px;font-weight:800;margin-top:7px}.panel{border:1px solid #e1e4e8;border-radius:15px;padding:22px;margin-top:18px}.panel h2{font-size:18px;margin:0 0 18px}.chart{height:260px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid #dadce0;padding:10px 8px 0}.bar{flex:1;min-width:12px;background:#16a085;border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:#80868b}.note{color:#5f6368;font-size:13px;line-height:1.6}.prob{font-size:45px;font-weight:800;color:#16a085}.links a:last-child{font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.links a{display:none}}
</style></head><body>
<nav><div class="brand">BookMy<span>Toilet</span></div><div class="links"><a href="home.html">Home</a><a href="booking.html">Booking</a><a href="behaviour.html">Behaviour</a><a href="ranking.html">Ranking</a><a href="community.html">Community</a></div></nav>
<main><div class="title"><h1>My Behaviour</h1><p>Your toilet-use pattern based on recorded usage logs.</p></div>
<div class="grid"><div class="card"><div class="label">USAGE RECORDS</div><div class="value" id="count">0</div></div><div class="card"><div class="label">AVERAGE TIME</div><div class="value"><span id="avg">0</span> min</div></div><div class="card"><div class="label">ESTIMATED NEXT-USE CHANCE</div><div class="prob" id="prob">0%</div></div></div>
<div class="panel"><h2>Usage pattern</h2><div id="chart" class="chart"></div></div>
<div class="panel"><h2>Behaviour interpretation</h2><p id="note" class="note">Collecting enough usage data to identify a pattern.</p></div></main>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
    getFirestore,
    collection,
    addDoc,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    Timestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBO7VfF6_g0xqlk5hN6U3gVScepf1rxdMQ",
    authDomain: "bookmytoilet-d9db9.firebaseapp.com",
    projectId: "bookmytoilet-d9db9",
    storageBucket: "bookmytoilet-d9db9.firebasestorage.app",
    messagingSenderId: "312633534307",
    appId: "1:312633534307:web:d27390e8af8a4473001556"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth,user=>{if(!user){location.href="login.html";return}load(user.uid)});
async function load(uid){
 const q=query(collection(db,"usageLogs"),where("userId","==",uid));
 const snap=await getDocs(q);const logs=snap.docs.map(d=>d.data());
 document.getElementById("count").textContent=logs.length;
 const avg=logs.length?logs.reduce((a,x)=>a+Number(x.duration||0),0)/logs.length:0;
 document.getElementById("avg").textContent=avg.toFixed(1);
 const byHour=Array(24).fill(0);logs.forEach(x=>{if(x.time)byHour[Number(x.time.split(":")[0])]++});
 const total=logs.length, peak=Math.max(...byHour,0);
 const probability=total?Math.min(99,Math.round((peak/total)*100*0.7+(Math.min(total,20)/20)*30)):0;
 document.getElementById("prob").textContent=probability+"%";
 const chart=document.getElementById("chart");chart.innerHTML="";
 byHour.forEach((v,h)=>{const b=document.createElement("div");b.className="bar";b.style.height=(peak?v/peak*88+4:4)+"%";b.innerHTML=`<span>${h}</span>`;chart.appendChild(b)});
 document.getElementById("note").textContent=total<5?"More usage records are needed for a reliable behaviour estimate.":"Your recorded usage has enough observations to show recurring time-of-day tendencies. This percentage is a simple project estimate, not a medical or predictive guarantee.";
}
</script></body></html>
